<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분실물 찾기</title>
<meta name="description" content="우리 학교 분실물을 사진으로 등록하고 찾아보는 곳">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e6f4ee'/%3E%3Cpath d='M22 26a10 10 0 0 1 20 0v20a4 4 0 0 1-4 4H26a4 4 0 0 1-4-4z' fill='none' stroke='%230f7a5c' stroke-width='4'/%3E%3Cpath d='M27 36h10' stroke='%230f7a5c' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f6faf8;
    --surface: #ffffff;
    --line: #e3ebe7;
    --text: #17231e;
    --muted: #63736c;
    --brand: #0f7a5c;
    --brand-dark: #0b5e47;
    --brand-soft: #e6f4ee;
    --warn: #b4531a;
    --warn-soft: #fdf0e6;
    --danger: #c0352b;
    --shadow: 0 10px 30px rgba(15, 60, 45, .08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { display: block; max-width: 100%; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px clamp(16px, 4vw, 28px);
    background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; color: var(--text); text-decoration: none; }
  .logo-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--brand-soft); display: grid; place-items: center; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .pill { font-size: 12px; font-weight: 500; color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 5px 11px; }
  .admin-btn { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--muted); }
  .admin-btn.on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

  .hero {
    padding: clamp(40px, 8vw, 80px) 16px 32px;
    text-align: center;
    background: radial-gradient(circle at 90% 0%, #e3f5ec 0, transparent 45%), var(--bg);
  }
  .hero h1 { font-size: clamp(26px, 5vw, 36px); margin: 16px 0 10px; letter-spacing: -0.02em; }
  .hero p { color: var(--muted); margin: 0 0 28px; }
  .search-card {
    max-width: 560px; margin: 0 auto; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 22px; box-shadow: var(--shadow);
  }
  .search-card label { font-weight: 700; font-size: 14px; display: block; margin-bottom: 10px; }
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
  .search-box input {
    width: 100%; height: 48px; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 0 14px 0 44px; outline: none; background: #fff;
  }
  .search-box input:focus { border-color: var(--brand); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .btn {
    height: 46px; border-radius: 12px; font-weight: 700; border: 1.5px solid var(--brand);
    background: #fff; color: var(--brand); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 16px;
  }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.ghost { border-color: var(--line); color: var(--muted); }

  main { max-width: 1100px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 28px) 60px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 12px 0 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .toggle { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .result-head { display: flex; align-items: baseline; gap: 8px; }
  .result-head h2 { font-size: 20px; margin: 0; }
  .count { color: var(--muted); font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    text-align: left; padding: 0; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .card .thumb { aspect-ratio: 4 / 3; background: var(--bg-soft); position: relative; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 12px 14px 14px; display: grid; gap: 4px; }
  .card .name { font-weight: 700; font-size: 16px; }
  .card .meta { font-size: 13px; color: var(--muted); }
  .badge { position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 9px; background: var(--brand); color: #fff; }
  .badge.returned { background: #6b7280; }
  .card.returned .thumb img { filter: grayscale(.8); opacity: .7; }

  .empty { text-align: center; color: var(--muted); padding: 50px 16px; border: 1.5px dashed var(--line); border-radius: 16px; }
  .empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

  dialog {
    border: none; border-radius: 20px; padding: 0; width: min(560px, calc(100vw - 32px));
    max-height: calc(100vh - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.25); color: var(--text); background: var(--surface);
  }
  dialog::backdrop { background: rgba(10, 25, 20, .45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 0; }
  .dlg-head h3 { margin: 0; font-size: 19px; }
  .x { border: none; background: var(--bg-soft); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; color: var(--muted); }
  .dlg-body { padding: 16px 20px 20px; display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field > span { font-size: 14px; font-weight: 700; }
  .field > span em { color: var(--danger); font-style: normal; }
  .field input, .field select, .field textarea {
    border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; outline: none; width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); }
  .field textarea { resize: vertical; min-height: 72px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .photo-drop {
    border: 1.5px dashed #b9d3c8; border-radius: 14px; background: var(--bg-soft);
    min-height: 170px; display: grid; place-items: center; text-align: center; color: var(--muted);
    position: relative; overflow: hidden; cursor: pointer;
  }
  .photo-drop img { width: 100%; max-height: 260px; object-fit: contain; background: #fff; }
  .photo-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .photo-drop .hint b { display: block; color: var(--brand); font-size: 15px; margin: 6px 0 2px; }
  .error { color: var(--danger); font-size: 14px; min-height: 1em; margin: 0; }

  .detail-img { width: 100%; max-height: 52vh; object-fit: contain; background: var(--bg-soft); }
  .detail-list { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 15px; }
  .detail-list dt { color: var(--muted); }
  .detail-list dd { margin: 0; word-break: break-word; }
  .notice { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions .btn { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: .2s; z-index: 100; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { background: linear-gradient(90deg, #eef3f1 25%, #f6faf8 50%, #eef3f1 75%); background-size: 200% 100%; animation: shine 1.2s infinite; border-radius: 16px; height: 240px; }
  @keyframes shine { to { background-position: -200% 0; } }

  @media (max-width: 520px) {
    header .pill { display: none; }
    .two { grid-template-columns: 1fr; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card .body { padding: 10px; }
    .card .name { font-size: 15px; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="#">
    <span class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f7a5c" stroke-width="2" stroke-linecap="round"><path d="M7 9a5 5 0 0 1 10 0v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><path d="M10 14h4M9 5V3.5M15 5V3.5"/></svg>
    </span>
    분실물 찾기
  </a>
  <div class="header-right">
    <span class="pill">우리 학교 물건 찾는 곳</span>
    <button class="admin-btn" id="adminBtn" type="button">선생님</button>
  </div>
</header>

<section class="hero">
  <span class="pill">함께 찾는 우리 학교 분실물</span>
  <h1>잃어버린 물건을 찾아봐요</h1>
  <p>물건 이름으로 찾아보거나, 주운 물건을 사진과 함께 등록해 주세요.</p>
  <form class="search-card" id="searchForm">
    <label for="q">어떤 물건을 찾고 있나요?</label>
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f7a5c" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="예: 파란색 필통" autocomplete="off">
    </div>
    <div class="row">
      <button class="btn" type="button" id="openRegister">물건 등록하기</button>
      <button class="btn primary" type="submit">물건 찾기</button>
    </div>
  </form>
</section>

<main id="results">
  <div class="toolbar">
    <div class="result-head"><h2 id="resultTitle">보관 중인 물건</h2><span class="count" id="count"></span></div>
    <label class="toggle"><input type="checkbox" id="showReturned"> 주인 찾은 물건도 보기</label>
  </div>
  <div class="chips" id="chips" style="margin-bottom:18px"></div>
  <div class="grid" id="grid"></div>
</main>

<!-- 등록 -->
<dialog id="registerDlg">
  <form id="registerForm" novalidate>
    <div class="dlg-head"><h3>주운 물건 등록하기</h3><button class="x" type="button" data-close aria-label="닫기">×</button></div>
    <div class="dlg-body">
      <label class="photo-drop" id="photoDrop">
        <div class="hint" id="photoHint">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0f7a5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <b>사진 찍기 / 고르기</b>물건이 잘 보이게 찍어 주세요
        </div>
        <input type="file" id="photo" accept="image/*" capture="environment">
      </label>
      <label class="field"><span>물건 이름 <em>*</em></span><input id="fName" maxlength="40" placeholder="예: 파란색 필통" required></label>
      <div class="two">
        <label class="field"><span>종류</span><select id="fCategory"></select></label>
        <label class="field"><span>색깔</span><input id="fColor" maxlength="20" placeholder="예: 파랑"></label>
      </div>
      <div class="two">
        <label class="field"><span>주운 곳</span><input id="fPlace" maxlength="40" placeholder="예: 3층 복도"></label>
        <label class="field"><span>주운 날</span><input id="fDate" type="date"></label>
      </div>
      <label class="field"><span>지금 맡겨 둔 곳</span><input id="fKept" maxlength="40" placeholder="예: 교무실, 5-2 교실"></label>
      <label class="field"><span>특징</span><textarea id="fDesc" maxlength="300" placeholder="이름표, 열쇠고리 등 눈에 띄는 점"></textarea></label>
      <label class="field"><span>등록한 사람 (선택)</span><input id="fFinder" maxlength="20" placeholder="예: 5학년 2반"></label>
      <p class="error" id="regError"></p>
      <button class="btn primary" type="submit" id="regSubmit">등록하기</button>
    </div>
  </form>
</dialog>

<!-- 상세 -->
<dialog id="detailDlg">
  <div class="dlg-head"><h3 id="dTitle"></h3><button class="x" type="button" data-close aria-label="닫기">×</button></div>
  <div class="dlg-body" id="dBody"></div>
</dialog>

<!-- 선생님 로그인 -->
<dialog id="adminDlg">
  <form id="adminForm">
    <div class="dlg-head"><h3>선생님 모드</h3><button class="x" type="button" data-close aria-label="닫기">×</button></div>
    <div class="dlg-body">
      <p style="margin:0;color:var(--muted);font-size:14px">선생님 모드에서는 "주인 찾음" 표시와 삭제를 할 수 있어요.</p>
      <label class="field"><span>관리자 비밀번호</span><input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
      <p class="error" id="pinError"></p>
      <button class="btn primary" type="submit">확인</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
const CATEGORIES = ['학용품', '옷·모자', '물통·도시락', '가방·주머니', '전자기기', '장난감', '기타'];
const $ = (s) => document.querySelector(s);
const state = { items: [], loading: true, error: '', q: '', cat: '전체', showReturned: false, pin: '' };

try { state.pin = sessionStorage.getItem('lf-pin') || ''; } catch {}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
  return n;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.slice(0, 10).split('-');
  return `${Number(m)}월 ${Number(day)}일`;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || '문제가 생겼어요. 잠시 후 다시 해 주세요.');
  return data;
}

async function load() {
  state.loading = true; state.error = ''; render();
  try {
    const { items } = await api('/api/items');
    state.items = items;
  } catch (e) {
    state.error = e.message;
  }
  state.loading = false;
  render();
}

function matches(it) {
  if (!state.showReturned && it.status === 'returned') return false;
  if (state.cat !== '전체' && it.category !== state.cat) return false;
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  const hay = [it.name, it.color, it.foundPlace, it.keptAt, it.description, it.category].join(' ').toLowerCase().replace(/색/g, '');
  return words.every((w) => hay.includes(w.replace(/색$/, '')));
}

function renderChips() {
  const box = $('#chips');
  box.replaceChildren(...['전체', ...CATEGORIES].map((c) =>
    el('button', { type: 'button', class: 'chip' + (state.cat === c ? ' on' : ''), onclick: () => { state.cat = c; render(); } }, c)
  ));
}

function render() {
  renderChips();
  $('#adminBtn').classList.toggle('on', Boolean(state.pin));
  $('#adminBtn').textContent = state.pin ? '선생님 모드 ✓' : '선생님';
  $('#resultTitle').textContent = state.q ? `"${state.q}" 찾은 결과` : (state.showReturned ? '모든 물건' : '보관 중인 물건');
  const grid = $('#grid');

  if (state.loading) {
    $('#count').textContent = '';
    grid.replaceChildren(...Array.from({ length: 4 }, () => el('div', { class: 'skeleton' })));
    return;
  }
  if (state.error) {
    $('#count').textContent = '';
    grid.replaceChildren(el('div', { class: 'empty', style: 'grid-column:1/-1' },
      el('strong', {}, '목록을 불러오지 못했어요'), state.error, el('br'), el('br'),
      el('button', { class: 'btn', type: 'button', onclick: load }, '다시 불러오기')));
    return;
  }

  const list = state.items.filter(matches);
  $('#count').textContent = `${list.length}개`;
  if (!list.length) {
    grid.replaceChildren(el('div', { class: 'empty', style: 'grid-column:1/-1' },
      el('strong', {}, state.q || state.cat !== '전체' ? '찾는 물건이 아직 없어요' : '등록된 물건이 아직 없어요'),
      state.q ? '다른 말로 찾아보거나, 나중에 다시 확인해 보세요.' : '주운 물건이 있다면 "물건 등록하기"를 눌러 주세요.'));
    return;
  }
  grid.replaceChildren(...list.map((it) => {
    const returned = it.status === 'returned';
    return el('button', { type: 'button', class: 'card' + (returned ? ' returned' : ''), onclick: () => openDetail(it.id) },
      el('div', { class: 'thumb' },
        el('img', { src: it.photoUrl, alt: it.name, loading: 'lazy' }),
        el('span', { class: 'badge' + (returned ? ' returned' : '') }, returned ? '주인 찾음' : '보관 중')),
      el('div', { class: 'body' },
        el('div', { class: 'name' }, it.name),
        el('div', { class: 'meta' }, [it.foundPlace, fmtDate(it.foundDate || it.createdAt)].filter(Boolean).join(' · ')),
        it.keptAt ? el('div', { class: 'meta' }, `📍 ${it.keptAt}`) : null));
  }));
}

function openDetail(id) {
  const it = state.items.find((x) => x.id === id);
  if (!it) return;
  const returned = it.status === 'returned';
  $('#dTitle').textContent = it.name;
  const rows = [
    ['상태', returned ? '주인 찾음' : '보관 중'],
    ['종류', it.category],
    ['색깔', it.color],
    ['주운 곳', it.foundPlace],
    ['주운 날', fmtDate(it.foundDate)],
    ['맡겨 둔 곳', it.keptAt],
    ['특징', it.description],
    ['등록한 사람', it.finder],
    ['등록일', fmtDate(it.createdAt)],
  ].filter(([, v]) => v);

  const body = $('#dBody');
  body.replaceChildren(
    el('img', { class: 'detail-img', src: it.photoUrl, alt: it.name }),
    el('dl', { class: 'detail-list' }, rows.flatMap(([k, v]) => [el('dt', {}, k), el('dd', {}, v)])),
    returned ? null : el('div', { class: 'notice' }, `내 물건이라면 ${it.keptAt ? `${it.keptAt}에 가서` : '선생님께 말하고'} 찾아가요!`),
    state.pin ? el('div', { class: 'actions' },
      el('button', { class: 'btn primary', type: 'button', onclick: () => manage(it.id, returned ? 'reopen' : 'return') }, returned ? '다시 보관 중으로' : '주인 찾음 표시'),
      el('button', { class: 'btn danger', type: 'button', onclick: () => manage(it.id, 'delete') }, '삭제')) : null
  );
  $('#detailDlg').showModal();
}

async function manage(id, action) {
  if (action === 'delete' && !confirm('이 물건을 삭제할까요? 되돌릴 수 없어요.')) return;
  try {
    const data = await api('/api/manage', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, action, pin: state.pin }) });
    if (action === 'delete') {
      state.items = state.items.filter((x) => x.id !== id);
      $('#detailDlg').close();
      toast('삭제했어요.');
    } else {
      state.items = state.items.map((x) => (x.id === id ? data.item : x));
      $('#detailDlg').close();
      toast(action === 'return' ? '주인을 찾았어요! 🎉' : '다시 보관 중으로 바꿨어요.');
    }
    render();
  } catch (e) {
    toast(e.message);
  }
}

// ---------- 사진: 기기에서 줄여서(최대 1280px) 올리기 ----------
let photoData = '';
async function compress(file) {
  let source;
  try {
    source = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    source = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'));
      img.src = URL.createObjectURL(file);
    });
  }
  const w0 = source.width, h0 = source.height;
  const scale = Math.min(1, 1280 / Math.max(w0, h0));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w0 * scale);
  canvas.height = Math.round(h0 * scale);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.82);
}

$('#photo').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $('#regError').textContent = '';
  try {
    photoData = await compress(file);
    const drop = $('#photoDrop');
    drop.querySelector('img')?.remove();
    $('#photoHint').hidden = true;
    drop.prepend(el('img', { src: photoData, alt: '고른 사진' }));
  } catch (err) {
    photoData = '';
    $('#regError').textContent = err.message;
  }
});

function resetForm() {
  $('#registerForm').reset();
  photoData = '';
  $('#photoDrop').querySelector('img')?.remove();
  $('#photoHint').hidden = false;
  $('#regError').textContent = '';
  $('#fDate').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

$('#fCategory').append(...CATEGORIES.map((c) => el('option', { value: c }, c)));

$('#openRegister').addEventListener('click', () => { resetForm(); $('#registerDlg').showModal(); });

$('#registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('#regError');
  const name = $('#fName').value.trim();
  if (!photoData) { err.textContent = '물건 사진을 넣어 주세요.'; return; }
  if (!name) { err.textContent = '물건 이름을 적어 주세요.'; $('#fName').focus(); return; }
  const btn = $('#regSubmit');
  btn.disabled = true;
  btn.replaceChildren(el('span', { class: 'spinner' }), ' 올리는 중…');
  try {
    const { item } = await api('/api/items', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        name,
        category: $('#fCategory').value,
        color: $('#fColor').value,
        foundPlace: $('#fPlace').value,
        foundDate: $('#fDate').value,
        keptAt: $('#fKept').value,
        description: $('#fDesc').value,
        finder: $('#fFinder').value,
        photo: photoData,
      }),
    });
    state.items.unshift(item);
    state.q = ''; $('#q').value = ''; state.cat = '전체';
    $('#registerDlg').close();
    render();
    toast('등록했어요! 고마워요 😊');
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '등록하기';
  }
});

$('#searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  state.q = $('#q').value.trim();
  render();
  $('#results').scrollIntoView({ behavior: 'smooth' });
});
$('#q').addEventListener('input', (e) => { if (!e.target.value) { state.q = ''; render(); } });
$('#showReturned').addEventListener('change', (e) => { state.showReturned = e.target.checked; render(); });

$('#adminBtn').addEventListener('click', () => {
  if (state.pin) {
    state.pin = '';
    try { sessionStorage.removeItem('lf-pin'); } catch {}
    render();
    toast('선생님 모드를 껐어요.');
    return;
  }
  $('#pin').value = ''; $('#pinError').textContent = '';
  $('#adminDlg').showModal();
});
$('#adminForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pin = $('#pin').value;
  try {
    await api('/api/manage', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'check', pin }) });
    state.pin = pin;
    try { sessionStorage.setItem('lf-pin', pin); } catch {}
    $('#adminDlg').close();
    render();
    toast('선생님 모드가 켜졌어요. 물건을 눌러 관리하세요.');
  } catch (ex) {
    $('#pinError').textContent = ex.message;
  }
});

document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));

load();
</script>
